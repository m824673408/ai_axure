name: Product Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global product-prototype-core
      - run: proto lint
      - run: npm --prefix prototype install
      - run: npm --prefix prototype run build
